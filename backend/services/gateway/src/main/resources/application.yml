server:
  port: 8080

spring:
  application:
    name: admitatlas-gateway
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: 127.0.0.1:8848
      config:
        enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-user
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**,/api/v1/student/**
        - id: school
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/schools/**,/api/v1/majors/**
        - id: score
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/admission/**,/api/v1/segments/**,/api/v1/batch-lines/**
        - id: policy-rule
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/rules/**,/api/v1/policies/**
        - id: match-engine
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/match/**
        - id: plan-report
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/plans/**
      # data-collector 为离线独立部署，不注册到 C 端网关

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

admitatlas:
  stage: P0-skeleton
  data-version: uninitialized
