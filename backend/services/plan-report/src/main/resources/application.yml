server:
  port: 8086

spring:
  application:
    name: admitatlas-plan-report
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: 127.0.0.1:8848
      config:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

admitatlas:
  stage: P0-skeleton
  data-version: uninitialized
