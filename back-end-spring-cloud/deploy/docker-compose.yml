services:
  mysql:
    image: mysql:8.0
    container_name: admitatlas-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admitatlas_dev}
      MYSQL_DATABASE: admitatlas
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # P1 起 schema 由 Flyway 统一管理（launcher/src/main/resources/db/migration/），
      # 不再通过 initdb 挂载建表，避免与 Flyway 迁移重复执行。
      # ../sql/V1__init.sql 是 MySQL 分区优化版 DDL，仅供生产手动调优时参考。
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-admitatlas_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: admitatlas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: admitatlas-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
